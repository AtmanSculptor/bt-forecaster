name: Forecast on new AI tournament questions

# FutureEval questions are open only 1.5 to 3 hours, and GitHub's cron is unreliable.
# So each run polls in a loop for about 5.5 hours, then starts the next run itself.
# The cron below is only a backup in case the chain ever breaks.
on:
  workflow_dispatch:
  schedule:
    - cron: "7 */3 * * *"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  forecast_job:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true
      - name: Install dependencies
        run: poetry install --no-interaction --no-root
      - name: Run bot every 20 minutes for about 5.5 hours
        run: |
          end=$((SECONDS + 330*60))
          while [ $SECONDS -lt $end ]; do
            echo "=== Poll at $(date -u) ==="
            poetry run python main.py || echo "Run failed, will try again next poll"
            sleep 1080
          done
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
      - name: Start the next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run run_bot_on_tournament.yaml --ref main --repo ${{ github.repository }}
